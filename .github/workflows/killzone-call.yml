name: killzone-call

# Places a phone-call reminder at the killzone times. The scheduled run
# fires every 15 minutes; scripts/killzone-call.mjs compares the *actual*
# current New York time (DST-correct) against the reminder slots and only
# calls when one matches, so US DST shifts are handled automatically.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Place a test call right now (ignores killzone times)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: killzone-call
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Killzone reminder call
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            node scripts/killzone-call.mjs --test --dry-run
            node scripts/killzone-call.mjs --test
          else
            node scripts/killzone-call.mjs
          fi
